<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="任务指挥台">
<meta name="theme-color" content="#F0B72E">
<title>Amanda 任务指挥台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- 顶部应用栏 -->
<header id="appbar">
  <div class="appbar-inner">
    <div id="greeting">
      <div class="date-line"></div>
      <div class="greet-line"></div>
    </div>
    <button id="settings-btn" aria-label="设置">⚙︎</button>
  </div>
</header>

<!-- 主内容区(每个视图一个 section,切换显示) -->
<main id="main">

  <!-- 1. 今日 -->
  <section class="view" data-view="today">
    <div class="stats-row" id="stats-row"></div>
    <div id="today-content"></div>
  </section>

  <!-- 2. 客户 -->
  <section class="view" data-view="customer" hidden>
    <div id="customer-content"></div>
  </section>

  <!-- 3. 团队 -->
  <section class="view" data-view="team" hidden>
    <div id="team-content"></div>
  </section>

  <!-- 4. 节奏 (长期) -->
  <section class="view" data-view="rhythm" hidden>
    <div class="filter-bar" id="rhythm-filter">
      <button class="chip active" data-rhythm="frequency">频率型</button>
      <button class="chip" data-rhythm="date">日期型</button>
    </div>
    <div id="rhythm-content"></div>
  </section>

  <!-- 5. 出差 -->
  <section class="view" data-view="trip" hidden>
    <div class="trip-header">
      <h2>出差</h2>
      <p class="muted">每次出差是一个临时项目</p>
    </div>
    <div id="trip-content"></div>
  </section>

  <!-- 6. 笔记 -->
  <section class="view" data-view="notes" hidden>
    <div class="filter-bar" id="notes-filter">
      <button class="chip active" data-notes-cat="all">全部</button>
    </div>
    <div id="notes-content"></div>
  </section>

</main>

<!-- 浮动新建按钮 -->
<button id="fab" aria-label="新建任务">+</button>

<!-- 底部 Tab 导航 -->
<nav id="tabbar">
  <button class="tab active" data-tab="today">
    <span class="tab-icon">●</span><span class="tab-label">今日</span>
    <span class="tab-badge" id="badge-today" hidden></span>
  </button>
  <button class="tab" data-tab="customer">
    <span class="tab-icon">◉</span><span class="tab-label">客户</span>
  </button>
  <button class="tab" data-tab="team">
    <span class="tab-icon">🚗</span><span class="tab-label">客户来访</span>
  </button>
  <button class="tab" data-tab="rhythm">
    <span class="tab-icon">↻</span><span class="tab-label">长期</span>
  </button>
  <button class="tab" data-tab="trip">
    <span class="tab-icon">✈</span><span class="tab-label">出差</span>
  </button>
  <button class="tab" data-tab="notes">
    <span class="tab-icon">📝</span><span class="tab-label">笔记</span>
  </button>
</nav>

<!-- 模态层 -->
<div id="modal-root"></div>

<!-- Toast 提示层 -->
<div id="toast-root"></div>

<!-- Firebase SDK(可选,未配置时本地模式) -->
<script type="module">
  // 仅当 firebase-config.js 中填入了真实配置时才连接云端
  // 默认用 localStorage,数据立刻可用
</script>

<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
  // 注册 Service Worker(PWA + 推送 + 自动更新)
  if ('serviceWorker' in navigator) {
    let _refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (_refreshing) return;
      _refreshing = true;
      window.location.reload();  // 新 SW 接管后自动刷新
    });

    window.addEventListener('load', async () => {
      try {
        // updateViaCache:'none' 让浏览器每次都绕过 HTTP 缓存直接从网络拉 SW 文件
        // 否则 GH Pages 默认给 .js 文件 10 分钟缓存,更新根本发现不了
        const reg = await navigator.serviceWorker.register('service-worker.js', {
          updateViaCache: 'none',
        });

        // 启动时立刻检查更新(带时间戳,双保险绕过任何中间缓存)
        reg.update().catch(() => {});

        // 每 10 分钟自动检查一次新版本(比之前 30 分钟更及时)
        setInterval(() => reg.update().catch(() => {}), 10 * 60 * 1000);

        // 切回前台时也检查一次
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) reg.update().catch(() => {});
        });

        // 网络恢复时也检查
        window.addEventListener('online', () => reg.update().catch(() => {}));

        // 发现新 SW 安装就绪 → 显示横幅,让用户一键应用
        const handleNewWorker = (worker) => {
          if (!worker) return;
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateBanner(worker);
            }
          });
        };
        if (reg.waiting) showUpdateBanner(reg.waiting);
        reg.addEventListener('updatefound', () => handleNewWorker(reg.installing));
      } catch (err) {
        console.warn('SW 注册失败:', err);
      }
    });

    function showUpdateBanner(worker) {
      if (document.getElementById('update-banner')) return;
      const banner = document.createElement('div');
      banner.id = 'update-banner';
      banner.innerHTML = `
        <span>🎉 任务指挥台有新版本</span>
        <button id="ub-apply">立即更新</button>
        <button id="ub-dismiss">稍后</button>`;
      document.body.appendChild(banner);
      banner.querySelector('#ub-apply').onclick = () => {
        worker.postMessage({ type: 'SKIP_WAITING' });
        banner.querySelector('#ub-apply').textContent = '更新中…';
      };
      banner.querySelector('#ub-dismiss').onclick = () => banner.remove();
    }
  }
</script>

</body>
</html>
